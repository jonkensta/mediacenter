# smartd configuration - deploy to /etc/smartd.conf
#
# DAS thermal protection: every DAS drive is monitored with a 60C critical
# temperature threshold. Crossing it runs das-thermal-shutdown, which stops
# mount-das.service - dependents stop first, branches unmount, and the relay
# opens, physically cutting power to the DAS. See bin/das-thermal-shutdown.
#
# Devices are named by /dev/disk/by-id so sdX reshuffles don't matter.
# `-d removable` keeps smartd alive across DAS power cycles (the drives
# disappear while the relay is open). mount-das.service reloads smartd after
# a successful start so drives that were absent at smartd startup get
# registered again.
#
# Poll interval is set in /etc/conf.d/smartd (-i 300, 5 minutes).

# Root NVMe: listed first, BEFORE the DEFAULT line, so it never inherits the
# DAS shutdown hook - an overheating root SSD is not a reason to cut DAS
# power. Warnings go to syslog only. 70C logs, 80C warns.
/dev/disk/by-id/nvme-CT500P3PSSD8_2301E6992FAF -a -W 5,70,80

# DAS drives: -a health/attribute monitoring; -n standby,q skips polls while
# a drive is spun down (a sleeping drive is not overheating); -W 4,55,60
# tracks changes >=4C, logs at 55C, and fires the warning at 60C.
# -m <nomailer> -M exec routes that warning to the shutdown script instead
# of mail. The script ignores every warning type except Temperature.
DEFAULT -a -d removable -n standby,q -W 4,55,60 -m <nomailer> -M exec /usr/local/bin/das-thermal-shutdown

