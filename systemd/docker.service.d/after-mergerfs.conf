# Drop-in for docker.service.
#
# Containers are declared `restart: unless-stopped`, so dockerd starts them by
# itself at boot - independently of mediaserver.service. dockerd is ready in
# seconds while mount-das/mergerfs can take minutes waiting on the DAS, so
# without this the containers bind-mount /mnt/merged while it is still an empty
# directory on the root filesystem.
#
# Install to /etc/systemd/system/docker.service.d/after-mergerfs.conf
[Unit]
After=mergerfs.service
Wants=mergerfs.service
