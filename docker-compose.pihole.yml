services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    environment:
      - PUID=1012
      - PGID=1012
      - TZ=America/Chicago
      # Pi-hole v6 replaced WEBPASSWORD with FTLCONF_webserver_api_password.
      # On v6 the old variable is ignored and the admin password is randomised
      # into the container log on first start.
      - FTLCONF_webserver_api_password=YOUR_PIHOLE_PASSWORD
    volumes:
      - ./config:/etc/pihole
    cap_add:
      - SYS_NICE
    restart: unless-stopped
    networks:
      - mediaserver

networks:
  mediaserver:
    external: true
