## Version 2025/07/18
# make sure that your healthchecks container is named healthchecks
# Deployed to /opt/mediaserver/swag/nginx/proxy-confs/healthchecks.subdomain.conf.
# Differs from the SWAG sample: the Authelia includes are enabled, and /ping/
# bypasses Authelia so unattended jobs can report in (the check UUID in the
# URL is the credential).
# make sure that your dns has a cname set for healthchecks

server {
    listen 443 ssl;
#    listen 443 quic;
    listen [::]:443 ssl;
#    listen [::]:443 quic;

    server_name healthchecks.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    # enable for Authelia (requires authelia-location.conf in the location block)
    include /config/nginx/authelia-server.conf;

    location / {
        # enable for Authelia (requires authelia-server.conf in the server block)
        include /config/nginx/authelia-location.conf;

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app healthchecks;
        set $upstream_port 8000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    location ~ ^/ping/ {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        # Healthchecks trusts Remote-Email (REMOTE_USER_HEADER); never let an
        # unauthenticated client supply it.
        proxy_set_header Remote-Email "";
        set $upstream_app healthchecks;
        set $upstream_port 8000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
