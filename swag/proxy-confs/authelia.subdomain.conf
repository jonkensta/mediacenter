## Version 2025/07/18
# make sure that your authelia container is named authelia
# Deployed to /opt/mediaserver/swag/nginx/proxy-confs/authelia.subdomain.conf.
# Identical to the SWAG sample. This is the standalone portal host
# (https://authelia.jstarr.me/authelia/ — note the subfolder, which matches
# the '/authelia' path prefix in authelia/configuration.yml server.address).
# Protected services reach the portal via redirects from authelia-server.conf.
# make sure that your dns has a cname set for authelia

server {
    listen 443 ssl;
#    listen 443 quic;
    listen [::]:443 ssl;
#    listen [::]:443 quic;

    server_name authelia.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location / {

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app authelia;
        set $upstream_port 9091;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

    }

    location ~ (/authelia)?/api {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app authelia;
        set $upstream_port 9091;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

    }
}
