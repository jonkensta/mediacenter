secrets:
  foundry_config_json:
    file: ./foundryvtt/secrets.json

services:
  endlessh:
    image: lscr.io/linuxserver/endlessh:latest
    container_name: endlessh
    environment:
      - PUID=1012
      - PGID=1012
      - TZ=America/Chicago
      - MSDELAY=10000
      - MAXLINES=32
      - MAXCLIENTS=4096
      - LOGFILE=false
      - BINDFAMILY=
    volumes:
      - ./endlessh:/config
    ports:
      - 2222:2222/tcp
    restart: on-failure
    # Internet-facing tarpit: frontend only, so it cannot reach Deluge RPC,
    # the *arr APIs, or Gluetun's control server.
    networks:
      - frontend

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1012
      - PGID=1012
      - TZ=America/Chicago
    volumes:
      - ./radarr:/config
      - /mnt/merged/Movies:/movies
      - /mnt/merged/Downloads:/downloads
    restart: on-failure
    networks:
      - mediaserver

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1012
      - PGID=1012
      - TZ=America/Chicago
    volumes:
      - ./sonarr:/config
      - /mnt/merged/TV:/tv
      - /mnt/merged/Downloads:/downloads
    restart: on-failure
    networks:
      - mediaserver

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1012
      - PGID=1012
      - TZ=America/Chicago
    volumes:
      - ./bazarr:/config
      - /mnt/merged/Movies:/movies
      - /mnt/merged/TV:/tv
    restart: on-failure
    networks:
      - mediaserver

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1012
      - PGID=1012
      - TZ=America/Chicago
    volumes:
      - ./prowlarr:/config
    restart: on-failure
    networks:
      - mediaserver

  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1012
      - PGID=1012
      - TZ=America/Chicago
      - VPN_SERVICE_PROVIDER=private internet access
      - VPN_TYPE=openvpn
      - OPENVPN_USER=YOUR_VPN_USERNAME
      - OPENVPN_PASSWORD=YOUR_VPN_PASSWORD
      - PORT_FORWARD_ONLY=true
      - VPN_PORT_FORWARDING=on
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"apikey","apikey":"YOUR_GLUETUN_API_KEY"}
    volumes:
      - ./gluetun:/gluetun
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: on-failure
    networks:
      - mediaserver

  deluge:
    image: lscr.io/linuxserver/deluge:2.2.0-r1-ls364
    container_name: deluge
    network_mode: "service:gluetun"
    environment:
      - PUID=1012
      - PGID=1012
      - TZ=America/Chicago
      - DELUGE_LOGLEVEL=error
    volumes:
      - ./deluge:/config
      - /mnt/merged/Downloads:/downloads
    restart: on-failure
    depends_on:
      - gluetun

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1012
      - PGID=1012
      - TZ=America/Chicago
      - JELLYFIN_PublishedServerUrl=
    volumes:
      - ./jellyfin:/config
      - /mnt/merged/TV:/data/tvshows
      - /mnt/merged/Movies:/data/movies
    devices:
      - /dev/dri:/dev/dri
    restart: on-failure
    networks:
      - mediaserver

  heimdall:
    image: lscr.io/linuxserver/heimdall:latest
    container_name: heimdall
    environment:
      - PUID=1012
      - PGID=1012
      - TZ=America/Chicago
    volumes:
      - ./heimdall:/config
    restart: on-failure
    networks:
      - mediaserver

  foundryvtt:
    image: felddy/foundryvtt:release
    container_name: foundryvtt
    hostname: foundryvtt.jstarr.me
    user: "1012:1012"
    volumes:
      - ./foundryvtt/data:/data
    environment:
      - TZ=America/Chicago
      - CONTAINER_CACHE=/data/container_cache
      - FOUNDRY_PROXY_PORT=443
      - FOUNDRY_PROXY_SSL=true
      - FOUNDRY_SSL_CERT= # SSL handled by SWAG
      - FOUNDRY_SSL_KEY= # SSL handled by SWAG
      - FOUNDRY_ROUTE_PREFIX=
      - FOUNDRY_HOSTNAME=foundryvtt.jstarr.me
    secrets:
      - source: foundry_config_json 
        target: config.json
    networks:
      - mediaserver

  kimai-db:
    image: mysql:8.3
    container_name: kimai-db
    environment:
      - TZ=America/Chicago
      - MYSQL_DATABASE=kimai
      - MYSQL_USER=kimai
      - MYSQL_PASSWORD=YOUR_KIMAI_DB_PASSWORD
      - MYSQL_ROOT_PASSWORD=YOUR_KIMAI_DB_ROOT_PASSWORD
    command: --default-storage-engine innodb
    volumes:
      - ./kimai/mysql:/var/lib/mysql
    restart: on-failure
    healthcheck:
      test: mysqladmin -p$$MYSQL_ROOT_PASSWORD ping -h localhost
      interval: 20s
      start_period: 10s
      timeout: 10s
      retries: 3
    # Internal-only network: nothing but kimai can reach the database.
    networks:
      - kimai

  kimai:
    image: kimai/kimai2:apache
    container_name: kimai
    depends_on:
      kimai-db:
        condition: service_healthy
        restart: true
    environment:
      - TZ=America/Chicago
      - ADMINMAIL=YOUR_KIMAI_ADMIN_EMAIL
      - ADMINPASS=YOUR_KIMAI_ADMIN_PASSWORD
      # Docker bridge ranges, so X-Forwarded-Proto from SWAG is trusted and
      # generated URLs are https.
      - TRUSTED_PROXIES=172.16.0.0/12,127.0.0.1,::1
      - "DATABASE_URL=mysql://kimai:YOUR_KIMAI_DB_PASSWORD@kimai-db/kimai?charset=utf8mb4&serverVersion=8.3.0"
    volumes:
      - ./kimai/data:/opt/kimai/var/data
      - ./kimai/plugins:/opt/kimai/var/plugins
    restart: on-failure
    # No host port: reached only via SWAG (kimai.subdomain.conf, upstream 8001).
    networks:
      - mediaserver
      - kimai

  authelia:
    image: authelia/authelia:4.39
    container_name: authelia
    user: "1012:1012"
    environment:
      - TZ=America/Chicago
    volumes:
      - ./authelia:/config
    restart: on-failure
    # Forward-auth provider for SWAG (authelia-server.conf/authelia-location.conf
    # snippets). Backend-only: swag reaches it over the mediaserver network; it
    # publishes no ports and needs no route to anything else.
    networks:
      - mediaserver

  scrutiny:
    # Omnibus: web UI + InfluxDB + collector in one container. Runs as root:
    # smartctl needs raw device access (no PUID support). SMART history is
    # keyed by WWN (via /run/udev), so host sdX shuffles don't corrupt it.
    image: ghcr.io/analogj/scrutiny:master-omnibus
    container_name: scrutiny
    environment:
      - TZ=America/Chicago
    cap_add:
      - SYS_RAWIO # SATA SMART ioctls
      - SYS_ADMIN # NVMe admin commands
    volumes:
      - ./scrutiny/config:/opt/scrutiny/config
      - ./scrutiny/influxdb:/opt/scrutiny/influxdb
      - /run/udev:/run/udev:ro
    # Same drives as etc/smartd.conf, by stable /dev/disk/by-id names mapped to
    # fixed container-side nodes. Docker resolves the symlinks at container
    # start, so after a DAS power cycle the container must be restarted to
    # pick up re-enumerated devices - mount-das.service does this in
    # ExecStartPost (see systemd/mount-das.service).
    devices:
      - /dev/disk/by-id/nvme-CT500P3PSSD8_2301E6992FAF:/dev/nvme0n1
      - /dev/disk/by-id/ata-ST4000LM024-2AN17V_WCK0NYK4:/dev/sda
      - /dev/disk/by-id/ata-ST4000LM024-2AN17V_WCK0NEKR:/dev/sdb
      - /dev/disk/by-id/ata-ST4000LM024-2AN17V_WCK0R0RL:/dev/sdc
      - /dev/disk/by-id/ata-HGST_HUS724040ALE640_PK2338P4GXWMXC:/dev/sdd
      - /dev/disk/by-id/ata-WDC_WD120EMFZ-11A6JA0_9RG714DC:/dev/sde
      - /dev/disk/by-id/ata-Hitachi_HUS724040ALE641_PCHJ54EB:/dev/sdf
      - /dev/disk/by-id/ata-Hitachi_HUS724040ALE641_PBK9K9LS:/dev/sdg
    restart: on-failure
    # No host port: reached only via SWAG (scrutiny.subdomain.conf, behind
    # Authelia). Observability only - smartd remains the thermal actor.
    networks:
      - mediaserver

  cloudflare-ddns:
    # Replaces oznu/cloudflare-ddns, which has been archived upstream for years.
    # This one takes a scoped API token (Zone.DNS:Edit + Zone.Zone:Read on the
    # zone) rather than a Global API key.
    image: favonia/cloudflare-ddns:1
    container_name: cloudflare-ddns
    restart: on-failure
    user: "1012:1012"
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      - CLOUDFLARE_API_TOKEN=YOUR_CLOUDFLARE_API_TOKEN
      - DOMAINS=jstarr.me
      - PROXIED=false
      # Without this it probes for IPv6 on every run and logs errors on an
      # IPv4-only host. Set to "auto" if this host does have IPv6.
      - IP6_PROVIDER=none
      - TZ=America/Chicago
    networks:
      - mediaserver

  swag:
    image: lscr.io/linuxserver/swag:latest
    container_name: swag
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1012
      - PGID=1012
      - TZ=America/Chicago
      - URL=jstarr.me
      - VALIDATION=dns
      - SUBDOMAINS=wildcard
      - CERTPROVIDER=zerossl
      - DNSPLUGIN=cloudflare
      - PROPAGATION=
      - EMAIL=zerossl@jstarr.me
      - ONLY_SUBDOMAINS=false
      - EXTRA_DOMAINS=
      - STAGING=false
    volumes:
      - ./swag:/config
    ports:
      - 80:80
      - 443:443
    restart: on-failure
    # The only container on both networks: it terminates TLS on frontend and
    # proxies through to the services on mediaserver.
    networks:
      - frontend
      - mediaserver

networks:
  # Shared with docker-compose.pihole.yml, so it is created out-of-band:
  #   docker network create mediaserver
  mediaserver:
    external: true
  # Internet-facing tier (swag, endlessh). Compose manages this one.
  frontend:
    driver: bridge
  # kimai <-> kimai-db only; internal, so the db has no route out.
  kimai:
    driver: bridge
    internal: true
