secrets:
  foundry_config_json:
    file: ./foundryvtt/secrets.json

services:
  endlessh:
    image: lscr.io/linuxserver/endlessh:latest
    container_name: endlessh
    environment:
      - PUID=1012
      - PGID=1012
      - TZ=America/Chicago
      - MSDELAY=10000
      - MAXLINES=32
      - MAXCLIENTS=4096
      - LOGFILE=false
      - BINDFAMILY=
    volumes:
      - ./endlessh:/config
    ports:
      - 2222:2222/tcp
    restart: unless-stopped
    # Internet-facing tarpit: frontend only, so it cannot reach Deluge RPC,
    # the *arr APIs, or Gluetun's control server.
    networks:
      - frontend

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1012
      - PGID=1012
      - TZ=America/Chicago
    volumes:
      - ./radarr:/config
      - /mnt/merged/Movies:/movies
      - /mnt/merged/Downloads:/downloads
    restart: unless-stopped
    networks:
      - mediaserver

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1012
      - PGID=1012
      - TZ=America/Chicago
    volumes:
      - ./sonarr:/config
      - /mnt/merged/TV:/tv
      - /mnt/merged/Downloads:/downloads
    restart: unless-stopped
    networks:
      - mediaserver

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1012
      - PGID=1012
      - TZ=America/Chicago
    volumes:
      - ./bazarr:/config
      - /mnt/merged/Movies:/movies
      - /mnt/merged/TV:/tv
    restart: unless-stopped
    networks:
      - mediaserver

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1012
      - PGID=1012
      - TZ=America/Chicago
    volumes:
      - ./prowlarr:/config
    restart: unless-stopped
    networks:
      - mediaserver

  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1012
      - PGID=1012
      - TZ=America/Chicago
      - VPN_SERVICE_PROVIDER=private internet access
      - VPN_TYPE=openvpn
      - OPENVPN_USER=YOUR_VPN_USERNAME
      - OPENVPN_PASSWORD=YOUR_VPN_PASSWORD
      - PORT_FORWARD_ONLY=true
      - VPN_PORT_FORWARDING=on
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"apikey","apikey":"YOUR_GLUETUN_API_KEY"}
    volumes:
      - ./gluetun:/gluetun
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    networks:
      - mediaserver

  deluge:
    image: lscr.io/linuxserver/deluge:2.2.0-r1-ls364
    container_name: deluge
    network_mode: "service:gluetun"
    environment:
      - PUID=1012
      - PGID=1012
      - TZ=America/Chicago
      - DELUGE_LOGLEVEL=error
    volumes:
      - ./deluge:/config
      - /mnt/merged/Downloads:/downloads
    restart: unless-stopped
    depends_on:
      - gluetun

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1012
      - PGID=1012
      - TZ=America/Chicago
      - JELLYFIN_PublishedServerUrl=
    volumes:
      - ./jellyfin:/config
      - /mnt/merged/TV:/data/tvshows
      - /mnt/merged/Movies:/data/movies
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
    networks:
      - mediaserver

  heimdall:
    image: lscr.io/linuxserver/heimdall:latest
    container_name: heimdall
    environment:
      - PUID=1012
      - PGID=1012
      - TZ=America/Chicago
    volumes:
      - ./heimdall:/config
    restart: unless-stopped
    networks:
      - mediaserver

  foundryvtt:
    image: felddy/foundryvtt:release
    container_name: foundryvtt
    hostname: foundryvtt.jstarr.me
    user: "1012:1012"
    volumes:
      - ./foundryvtt/data:/data
    environment:
      - TZ=America/Chicago
      - CONTAINER_CACHE=/data/container_cache
      - FOUNDRY_PROXY_PORT=443
      - FOUNDRY_PROXY_SSL=true
      - FOUNDRY_SSL_CERT= # SSL handled by SWAG
      - FOUNDRY_SSL_KEY= # SSL handled by SWAG
      - FOUNDRY_ROUTE_PREFIX=
      - FOUNDRY_HOSTNAME=foundryvtt.jstarr.me
    secrets:
      - source: foundry_config_json 
        target: config.json
    networks:
      - mediaserver

  kimai-db:
    image: mysql:8.3
    container_name: kimai-db
    environment:
      - TZ=America/Chicago
      - MYSQL_DATABASE=kimai
      - MYSQL_USER=kimai
      - MYSQL_PASSWORD=YOUR_KIMAI_DB_PASSWORD
      - MYSQL_ROOT_PASSWORD=YOUR_KIMAI_DB_ROOT_PASSWORD
    command: --default-storage-engine innodb
    volumes:
      - ./kimai/mysql:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: mysqladmin -p$$MYSQL_ROOT_PASSWORD ping -h localhost
      interval: 20s
      start_period: 10s
      timeout: 10s
      retries: 3
    # Internal-only network: nothing but kimai can reach the database.
    networks:
      - kimai

  kimai:
    image: kimai/kimai2:apache
    container_name: kimai
    depends_on:
      kimai-db:
        condition: service_healthy
        restart: true
    environment:
      - TZ=America/Chicago
      - ADMINMAIL=YOUR_KIMAI_ADMIN_EMAIL
      - ADMINPASS=YOUR_KIMAI_ADMIN_PASSWORD
      # Docker bridge ranges, so X-Forwarded-Proto from SWAG is trusted and
      # generated URLs are https.
      - TRUSTED_PROXIES=172.16.0.0/12,127.0.0.1,::1
      - "DATABASE_URL=mysql://kimai:YOUR_KIMAI_DB_PASSWORD@kimai-db/kimai?charset=utf8mb4&serverVersion=8.3.0"
    volumes:
      - ./kimai/data:/opt/kimai/var/data
      - ./kimai/plugins:/opt/kimai/var/plugins
    restart: unless-stopped
    # No host port: reached only via SWAG (kimai.subdomain.conf, upstream 8001).
    networks:
      - mediaserver
      - kimai

  cloudflare-ddns:
    # Replaces oznu/cloudflare-ddns, which has been archived upstream for years.
    # This one takes a scoped API token (Zone.DNS:Edit + Zone.Zone:Read on the
    # zone) rather than a Global API key.
    image: favonia/cloudflare-ddns:1
    container_name: cloudflare-ddns
    restart: unless-stopped
    user: "1012:1012"
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      - CLOUDFLARE_API_TOKEN=YOUR_CLOUDFLARE_API_TOKEN
      - DOMAINS=jstarr.me
      - PROXIED=false
      # Without this it probes for IPv6 on every run and logs errors on an
      # IPv4-only host. Set to "auto" if this host does have IPv6.
      - IP6_PROVIDER=none
      - TZ=America/Chicago
    networks:
      - mediaserver

  swag:
    image: lscr.io/linuxserver/swag:latest
    container_name: swag
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1012
      - PGID=1012
      - TZ=America/Chicago
      - URL=jstarr.me
      - VALIDATION=dns
      - SUBDOMAINS=wildcard
      - CERTPROVIDER=zerossl
      - DNSPLUGIN=cloudflare
      - PROPAGATION=
      - EMAIL=zerossl@jstarr.me
      - ONLY_SUBDOMAINS=false
      - EXTRA_DOMAINS=
      - STAGING=false
    volumes:
      - ./swag:/config
    ports:
      - 80:80
      - 443:443
    restart: unless-stopped
    # The only container on both networks: it terminates TLS on frontend and
    # proxies through to the services on mediaserver.
    networks:
      - frontend
      - mediaserver

networks:
  # Shared with docker-compose.pihole.yml, so it is created out-of-band:
  #   docker network create mediaserver
  mediaserver:
    external: true
  # Internet-facing tier (swag, endlessh). Compose manages this one.
  frontend:
    driver: bridge
  # kimai <-> kimai-db only; internal, so the db has no route out.
  kimai:
    driver: bridge
    internal: true
